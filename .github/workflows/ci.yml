name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # 3.11 is the oldest supported version; 3.12 is what the Docker image ships.
    name: Lint, type-check and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lendflow
          POSTGRES_PASSWORD: lendflow
          POSTGRES_DB: lendflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lendflow -d lendflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://lendflow:lendflow@localhost:5432/lendflow_test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Type-check
        run: uv run mypy
      - name: Test with coverage
        run: uv run pytest --cov --cov-report=term-missing

  compose:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Check health, demo sign-in, seeded loans and reports
        run: python3 scripts/smoke_test.py http://localhost:8000
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down --volumes

  blueprint:
    # The live demo is deployed from render.yaml; a typo there would only show up on Render.
    name: Validate the Render Blueprint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Check render.yaml against Render's published schema
        run: uvx check-jsonschema==0.38.2 --schemafile https://render.com/schema/render.yaml.json render.yaml
